<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barcode Sheet Generator — WNDRR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  background:#fff;
  color:#111;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:2rem 1rem;
}
.wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
  max-width:400px;
}
.logo-box{
  width:130px;height:130px;
  border-radius:22px;
  overflow:hidden;
  margin-bottom:1.5rem;
}
.logo-box img{width:100%;height:100%;display:block}
.app-title{
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:#888;
  margin-bottom:1.5rem;
  font-weight:400;
}
.mode-toggle{
  display:flex;
  border:1px solid #ddd;
  border-radius:99px;
  padding:3px;
  margin-bottom:1.25rem;
  width:100%;
}
.mode-toggle button{
  flex:1;
  border:none;
  background:none;
  padding:.5rem .75rem;
  font-size:12px;
  font-family:inherit;
  color:#888;
  border-radius:99px;
  cursor:pointer;
  transition:background .15s,color .15s;
  white-space:nowrap;
}
.mode-toggle button.active{background:#111;color:#fff}
.status-line{
  font-size:15px;
  font-weight:400;
  color:#111;
  text-align:center;
  margin-bottom:.75rem;
  min-height:22px;
}
.prog-track{
  width:100%;
  height:4px;
  background:#e8e8e8;
  border-radius:99px;
  overflow:hidden;
  margin-bottom:1.5rem;
}
.prog-fill{
  height:100%;
  background:#5fd9b0;
  border-radius:99px;
  transition:width .3s ease;
  width:0%;
}
.pill-btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:.55rem 1.25rem;
  border:1px solid #ddd;
  border-radius:99px;
  background:#fff;
  font-size:13px;
  color:#333;
  cursor:pointer;
  transition:background .15s,border-color .15s;
  font-family:inherit;
  white-space:nowrap;
}
.pill-btn:hover{background:#f5f5f5;border-color:#bbb}
.pill-btn:disabled{opacity:.4;cursor:not-allowed}
.pill-btn.full{width:100%;justify-content:center}
.upload-wrap{position:relative;display:inline-flex}
.upload-wrap input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.name-row{
  display:flex;align-items:center;
  border:1px solid #ddd;border-radius:99px;
  overflow:hidden;background:#fff;
  width:100%;margin-bottom:.75rem;
}
.name-row input{
  flex:1;border:none;outline:none;
  padding:.55rem 1.1rem;
  font-size:13px;color:#333;
  font-family:inherit;background:transparent;
}
.name-row input::placeholder{color:#bbb}
.name-row .ext{
  padding:.55rem 1.1rem .55rem 0;
  font-size:13px;color:#bbb;
}
.stats-row{
  display:flex;gap:2rem;
  justify-content:center;
  margin-bottom:1rem;
}
.stat{text-align:center}
.stat strong{display:block;font-size:20px;font-weight:500;line-height:1.2}
.stat span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#bbb}
.msg{font-size:12px;text-align:center;margin-top:.5rem;color:#aaa}
.msg.err{color:#e05050}
.msg.ok{color:#3bb88a}
.file-loaded-row{
  display:flex;align-items:center;gap:8px;
  padding:.4rem .9rem .4rem 1.1rem;
  border:1px solid #ddd;border-radius:99px;
  font-size:12px;color:#555;
  margin-bottom:.75rem;
  width:100%;
  justify-content:space-between;
}
.file-loaded-row .fname{font-weight:500;color:#111;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.file-loaded-row button{background:none;border:none;cursor:pointer;color:#ccc;font-size:14px;line-height:1;padding:0 2px}
.file-loaded-row button:hover{color:#333}
</style>
</head>

  <div class="app-title">Barcode Sheet Generator</div>

  <div class="mode-toggle" id="modeToggle">

    <button id="csvModeBtn" onclick="setMode('csv')">Upload CSV</button>

  <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>

      <input type="text" id="poInput" placeholder="PO numbers, e.g. 4821, 4822">
    </div>
    <div class="name-row">
      <input type="text" id="soInput" placeholder="SO numbers, e.g. 5091, 5092">
    </div>
    <button class="pill-btn full" id="fetchBtn" onclick="fetchFromAM()">→ Fetch from ApparelMagic</button>
  </div>

    <button class="pill-btn">↑ Upload CSV file</button>

  </div>

      <span class="fname" id="fName"></span>

    </div>

  </div>

    <div class="name-row">

      <span class="ext">.xlsx</span>
    </div>

    <button class="pill-btn" id="genBtn" onclick="generate()">↓ Generate barcode XLSX</button>
  </div>

</div>

<script>
let data=[];
let mode='am';
const L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const R=['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
const PAR=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];

function setMode(m){
  if(data.length) clearFile();
  mode=m;
  document.getElementById('amModeBtn').classList.toggle('active',m==='am');
  document.getElementById('csvModeBtn').classList.toggle('active',m==='csv');
  document.getElementById('amRow').style.display=m==='am'?'block':'none';
  document.getElementById('uploadRow').style.display=m==='csv'?'flex':'none';
  setStatus(m==='am'?'Enter PO and/or SO numbers to begin':'Upload a CSV file to begin',0);
}

function parseCSV(txt){
  const lines=txt.trim().split('\n');
  const pr=line=>{const res=[];let inQ=false,cur='';for(let c of line){if(c==='"'){inQ=!inQ;continue;}if(c===','&&!inQ){res.push(cur);cur='';continue;}cur+=c;}res.push(cur);return res.map(v=>v.trim());};
  const headers=pr(lines[0]);
  return lines.slice(1).filter(l=>l.trim()).map(l=>{const v=pr(l),o={};headers.forEach((h,i)=>o[h]=v[i]||'');return o;});
}

function setStatus(txt,pct){
  document.getElementById('statusLine').textContent=txt;
  document.getElementById('progFill').style.width=pct+'%';
}
function showMsg(type,txt){
  const el=document.getElementById('msgBox');
  el.className='msg '+(type==='error'?'err':type==='success'?'ok':'');
  el.textContent=txt;
}

function showLoadedData(label){
  const styles=new Set(data.map(r=>r.Style||r.Product));
  const colours=new Set(data.map(r=>r.COLOUR));
  document.getElementById('fName').textContent=label;
  document.getElementById('statsRow').innerHTML=`
    <div class="stat"><strong>${data.length}</strong><span>SKUs</span></div>
    <div class="stat"><strong>${styles.size}</strong><span>Styles</span></div>
    <div class="stat"><strong>${colours.size}</strong><span>Colours</span></div>`;
  document.getElementById('amRow').style.display='none';
  document.getElementById('uploadRow').style.display='none';
  document.getElementById('fileLoaded').style.display='block';
  document.getElementById('nameRow').style.display='block';
  document.getElementById('genRow').style.display='block';
}

async function fetchFromAM(){
  const splitNumbers=raw=>[...new Set(raw.trim().split(/[,\s]+/).map(s=>s.trim()).filter(Boolean))];
  const poNumbers=splitNumbers(document.getElementById('poInput').value);
  const soNumbers=splitNumbers(document.getElementById('soInput').value);
  if(!poNumbers.length && !soNumbers.length){ showMsg('error','Enter at least one PO or SO number'); return; }
  document.getElementById('fetchBtn').disabled=true;
  document.getElementById('msgBox').textContent='';
  setStatus('Fetching from ApparelMagic...',20);
  try{
    const res=await fetch('/.netlify/functions/generate-barcode',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({poNumbers,soNumbers})
    });
    const body=await res.json();
    if(!res.ok) throw new Error(body.error||'Request failed');

    data=body.rows;
    if(!data.length) throw new Error('No line items found on the given PO/SO number(s)');

    const notFound=body.docResults.filter(r=>!r.found);
    const found=body.docResults.filter(r=>r.found);
    const label=type=>type==='po'?'PO':'SO';

    document.getElementById('fileName').value=`${found.map(r=>label(r.type)+'_'+r.number).join('_')}_Barcode_File`;
    showLoadedData(found.map(r=>label(r.type)+' '+r.number).join(', '));
    setStatus('Ready to generate',40);

    if(notFound.length){
      showMsg('error','⚠ Not found: '+notFound.map(r=>label(r.type)+' '+r.number).join(', ')+' — proceeding with the rest');
    }else{
      document.getElementById('msgBox').textContent='';
    }
  }catch(err){
    setStatus('Enter PO and/or SO numbers to begin',0);
    showMsg('error','Could not fetch from ApparelMagic: '+err.message);
  }finally{
    document.getElementById('fetchBtn').disabled=false;
  }
}

document.getElementById('fileInput').addEventListener('change',e=>{
  if(e.target.files[0]) loadFile(e.target.files[0]);
});

function loadFile(file){
  setStatus('Reading file...',10);
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      data=parseCSV(e.target.result);
      if(!data.length) throw new Error('No data rows found');
      // Detect scientific notation barcodes
      const badBarcodes = data.filter(r => /e\+/i.test(r.Barcode || ''));
      if (badBarcodes.length > 0) {
        showLoadedData(file.name);
        setStatus('Barcode issue detected — see below', 20);
        showMsg('error', '⚠ ' + badBarcodes.length + ' barcodes are in scientific notation (e.g. 9.35181E+12) — precision is lost in this CSV. Fix: in Better Reports, open the report → Edit → find the Barcode column → set format to Text, then re-export.');
        document.getElementById('genBtn').disabled = true;
      } else {
        showLoadedData(file.name);
        setStatus('Ready to generate', 40);
        document.getElementById('msgBox').textContent = '';
      }
    }catch(err){setStatus('Upload a CSV file to begin',0);showMsg('error','Could not parse CSV: '+err.message);}
  };
  reader.readAsText(file);
}

function clearFile(){
  data=[];
  document.getElementById('amRow').style.display=mode==='am'?'block':'none';
  document.getElementById('uploadRow').style.display=mode==='csv'?'flex':'none';
  document.getElementById('fileLoaded').style.display='none';
  document.getElementById('nameRow').style.display='none';
  document.getElementById('genRow').style.display='none';
  document.getElementById('fileInput').value='';
  document.getElementById('poInput').value='';
  document.getElementById('soInput').value='';
  document.getElementById('genBtn').disabled=false;
  document.getElementById('msgBox').textContent='';
  setStatus(mode==='am'?'Enter PO and/or SO numbers to begin':'Upload a CSV file to begin',0);
}

async function generate(){
  if(!data.length) return;
  document.getElementById('msgBox').textContent='';
  document.getElementById('genBtn').disabled=true;
  const rawName=document.getElementById('fileName').value.trim()||'barcode-sheet';
  const fileName=rawName.replace(/\.xlsx$/i,'')+'.xlsx';
  try{
    setStatus('Building workbook...',55);
    await new Promise(r=>setTimeout(r,30));
    const wb=XLSX.utils.book_new();
    const ws={};
    ws['!cols']=[{wch:17.16},{wch:25.66},{wch:18.83},{wch:8},{wch:14},{wch:16.83},{wch:16.5},{wch:16.5}];
    const headers=['Product','Description','COLOUR','SIZE','Category','Barcode','AUD Price','NZD Price'];
    const cc=new Set([5,6,7]);
    headers.forEach((h,ci)=>{
      const addr=XLSX.utils.encode_cell({r:0,c:ci});
      ws[addr]={v:h,t:'s',s:{font:{name:'Aptos Narrow',sz:12},alignment:cc.has(ci)?{horizontal:'center'}:{}}};
    });
    for(let i=0;i<data.length;i++){
      if(i%15===0){setStatus(`Processing ${i+1} of ${data.length}...`,55+Math.round(i/data.length*35));await new Promise(r=>setTimeout(r,0));}
      const row=data[i],ri=i+1;
      const aud=parseFloat(row['Retail Price']||'0')||0;
      const nzd=parseFloat((aud+10).toFixed(2));
      const barcode=(row.Barcode||'').trim();
      const vals=[
        {v:(row.Style||row.Product||'').trim(),t:'s'},
        {v:(row.Description||'').trim(),t:'s'},
        {v:(row.COLOUR||'').trim(),t:'s'},
        {v:(row.SIZE||'').trim(),t:'s'},
        {v:(row.Category||'').trim(),t:'s'},
        {v:barcode,t:'s'},
        {v:aud,t:'n'},{v:nzd,t:'n'}
      ];
      vals.forEach((cell,ci)=>{
        const addr=XLSX.utils.encode_cell({r:ri,c:ci});
        ws[addr]={...cell,s:{font:{name:'Aptos Narrow',sz:12},alignment:cc.has(ci)?{horizontal:'center'}:{}}};
      });
    }
    ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:data.length,c:7}});
    XLSX.utils.book_append_sheet(wb,ws,'Barcode Sheet');
    setStatus('Writing file...',95);
    await new Promise(r=>setTimeout(r,10));
    XLSX.writeFile(wb,fileName,{bookType:'xlsx',type:'binary',cellStyles:true});
    setStatus('Done — '+data.length+' SKUs exported',100);
    showMsg('success','"'+fileName+'" downloaded successfully');
    document.getElementById('genBtn').disabled=false;
  }catch(err){
    setStatus('Something went wrong',0);
    showMsg('error','Error: '+err.message);
    document.getElementById('genBtn').disabled=false;
  }
}
</script>
</body>
